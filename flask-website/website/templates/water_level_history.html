<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <style>
      .water-level-chart-container {
        position: relative;
        height: clamp(240px, calc(0.7 * min(100vh, 100vw)), 420px);
      }
    </style>
  </head>
  <body>
    <div class="container py-4">
      <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <div>
          <p class="text-uppercase text-muted mb-1">Reservoir monitoring</p>
          <h1 class="h2 mb-0">Water level history</h1>
        </div>
        <a href="{{ url_for('dashboard') }}" class="btn dashboard-back-button">Back to dashboard</a>
      </header>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <form method="get" action="{{ url_for('water_level_history') }}" class="row g-3 align-items-end">
            <div class="col-md-5">
              <label for="start-input" class="form-label">Start</label>
              <input id="start-input" name="start" type="datetime-local" class="form-control" value="" />
            </div>
            <div class="col-md-5">
              <label for="end-input" class="form-label">End</label>
              <input id="end-input" name="end" type="datetime-local" class="form-control" value="" />
            </div>

            <input id="start-utc-timestamp" type="hidden" name="start-utc-timestamp" value="{{ start_utc_timestamp or '' }}" />
            <input id="end-utc-timestamp" type="hidden" name="end-utc-timestamp" value="{{ end_utc_timestamp or '' }}" />

            <div class="col-md-2 d-grid">
              <button type="submit" class="btn btn-primary">Show chart</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="h5 mb-3">Water level in m</h2>
          <div class="water-level-chart-container">
            <canvas id="water-level-chart" class="w-100" aria-label="Water level chart"></canvas>
          </div>
          <div id="chart-empty-message" class="text-muted mt-2 d-none">No water-level data available for the selected period.</div>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='chart.umd.js') }}"></script>
    <script>
      (function () {
        const startInput = document.getElementById("start-input");
        const endInput = document.getElementById("end-input");
        const startUtcInput = document.getElementById("start-utc-timestamp");
        const endUtcInput = document.getElementById("end-utc-timestamp");

        function formatLocalDateTimeForInput(date) {
          const pad = (value) => String(value).padStart(2, "0");
          return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function setInputFromUtcTimestamp(input, utcValue) {
          if (!utcValue) {
            input.value = "";
            return;
          }

          const hasTimezoneSuffix = /[zZ]$|[+-]\d{2}:?\d{2}$/.test(utcValue);
          const normalizedUtcValue = hasTimezoneSuffix ? utcValue : `${utcValue}Z`;
          const parsedDate = new Date(normalizedUtcValue);

          if (Number.isNaN(parsedDate.getTime())) {
            input.value = "";
            return;
          }

          input.value = formatLocalDateTimeForInput(parsedDate);
        }

        function setUtcTimestampFromInput(input, hiddenInput) {
          const localValue = input.value;
          if (!localValue) {
            hiddenInput.value = "";
            return;
          }

          const parsedDate = new Date(localValue);
          if (Number.isNaN(parsedDate.getTime())) {
            hiddenInput.value = "";
            return;
          }

          hiddenInput.value = parsedDate.toISOString();
        }

        setInputFromUtcTimestamp(startInput, startUtcInput.value);
        setInputFromUtcTimestamp(endInput, endUtcInput.value);

        document.querySelector("form").addEventListener("submit", function () {
          setUtcTimestampFromInput(startInput, startUtcInput);
          setUtcTimestampFromInput(endInput, endUtcInput);
        });

        const rows = {{ chart_data | tojson }};
        const chartEmptyMessage = document.getElementById("chart-empty-message");

        if (!rows || rows.length === 0) {
          chartEmptyMessage.classList.remove("d-none");
          return;
        }

        const labels = rows.map((item) => {
          const date = new Date(item.timestamp);
          return Number.isNaN(date.getTime()) ? item.timestamp : date.toLocaleString();
        });
        const data = rows.map((item) => item.value);
        const canvas = document.getElementById("water-level-chart");
        const axisFontSize = Math.round(((Chart.defaults.font && Chart.defaults.font.size) || 12) * 1.2);

        new Chart(canvas, {
          type: "line",
          data: {
            labels: labels,
            datasets: [
              {
                label: "Water level in m",
                data: data,
              },
            ],
          },
          options: {
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: false,
              },
            },
            scales: {
              x: {
                ticks: {
                  font: {
                    size: axisFontSize,
                  },
                },
              },
              y: {
                beginAtZero: true,
                ticks: {
                  font: {
                    size: axisFontSize,
                  },
                },
              },
            },
          },
        });
      })();
    </script>
  </body>
</html>
