<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="container py-4">
      <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <div>
          <p class="text-uppercase text-muted mb-1">Reservoir monitoring</p>
          <h1 class="h2 mb-0">Water level live</h1>
        </div>
        <a href="{{ url_for('dashboard') }}" class="btn dashboard-back-button">Back to dashboard</a>
      </header>

      <div id="water-level-card" class="card shadow-sm d-none">
        <div class="card-body">
          <h2 class="h5 mb-3">Water level</h2>

          <div class="mb-3">
            <div class="text-muted small text-uppercase">Timestamp</div>
            <div id="water-level-timestamp" class="fs-5 fw-semibold">--</div>
          </div>

          <div>
            <div class="text-muted small text-uppercase">Water-level, in Meter</div>
            <div id="water-level-value" class="display-6 fw-bold mb-0">--</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const card = document.getElementById("water-level-card");
        const timestampElement = document.getElementById("water-level-timestamp");
        const valueElement = document.getElementById("water-level-value");

        async function loadWaterLevel() {
          try {
            const response = await fetch("{{ url_for('water_level_live_value') }}", { cache: "no-store" });
            if (!response.ok) {
              throw new Error("Failed to fetch water level");
            }

            const data = await response.json();
            const hasValue = data && data.value !== undefined && data.value !== null && data.value !== "";

            if (!hasValue) {
              card.classList.add("d-none");
              return;
            }

            card.classList.remove("d-none");

            const timestamp = data.timestamp;
            if (timestamp) {
              const parsedTimestamp = new Date(timestamp);
              timestampElement.textContent = Number.isNaN(parsedTimestamp.getTime())
                ? String(timestamp)
                : parsedTimestamp.toLocaleString();
            } else {
              timestampElement.textContent = "No timestamp available";
            }

            const numericValue = Number(data.value);
            valueElement.textContent = Number.isFinite(numericValue) ? `${numericValue.toFixed(2)} m` : "--";
          } catch (error) {
            card.classList.add("d-none");
          }
        }

        loadWaterLevel();
        setInterval(loadWaterLevel, 1000);
      })();
    </script>
  </body>
</html>
