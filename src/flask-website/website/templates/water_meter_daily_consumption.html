<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <style>
      .daily-consumption-chart-container {
        position: relative;
        height: clamp(240px, calc(0.7 * min(100vh, 100vw)), 420px);
      }
    </style>
  </head>
  <body>
    <div class="container py-4">
      <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <div>
          <p class="text-uppercase text-muted mb-1">Reservoir monitoring</p>
          <h1 class="h2 mb-0">Water meter daily consumption</h1>
        </div>
        <a href="{{ url_for('dashboard') }}" class="btn dashboard-back-button">Back to dashboard</a>
      </header>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <form method="get" action="{{ url_for('water_meter_daily_consumption') }}" class="row g-3 align-items-end">
            <div class="col-md-5">
              <label for="start-input" class="form-label">Start</label>
              <input id="start-input" name="start" type="date" class="form-control" value="{{ start_value }}" />
            </div>
            <div class="col-md-5">
              <label for="end-input" class="form-label">End</label>
              <input id="end-input" name="end" type="date" class="form-control" value="{{ end_value }}" />
            </div>
            <div class="col-md-2 d-grid">
              <button type="submit" class="btn btn-primary">Show chart</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="h5 mb-3">Daily consumption in m³</h2>
          <div class="daily-consumption-chart-container">
            <canvas id="daily-consumption-chart" class="w-100" aria-label="Daily consumption chart"></canvas>
          </div>
          <div id="daily-consumption-empty-message" class="text-muted mt-2 d-none">No daily consumption data available for the selected period.</div>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='chart.umd.js') }}"></script>
    <script>
      (function () {
        const rows = {{ chart_data | tojson }};
        const emptyMessage = document.getElementById("daily-consumption-empty-message");

        if (!rows || rows.length === 0) {
          emptyMessage.classList.remove("d-none");
          return;
        }

        const labels = rows.map((item) => {
          const date = new Date(item.date);
          if (Number.isNaN(date.getTime())) {
            return item.date;
          }

          const year = date.getFullYear();
          const month = String(date.getMonth() + 1).padStart(2, "0");
          const day = String(date.getDate()).padStart(2, "0");
          return `${year}-${month}-${day}`;
        });
        const data = rows.map((item) => (item.consumption !== null && item.consumption !== undefined ? item.consumption : null));
        const canvas = document.getElementById("daily-consumption-chart");
        const axisFontSize = Math.round(((Chart.defaults.font && Chart.defaults.font.size) || 12) * 1.2);

        new Chart(canvas, {
          type: "bar",
          data: {
            labels: labels,
            datasets: [
              {
                label: "Daily consumption in m³",
                data: data,
                borderRadius: 4,
                backgroundColor: "rgba(13, 110, 253, 0.6)",
                borderColor: "rgba(13, 110, 253, 1)",
                borderWidth: 1,
                spanGaps: true,
              },
            ],
          },
          options: {
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: false,
              },
            },
            scales: {
              x: {
                ticks: {
                  font: {
                    size: axisFontSize,
                  },
                },
              },
              y: {
                ticks: {
                  font: {
                    size: axisFontSize,
                  },
                },
              },
            },
          },
        });
      })();
    </script>
  </body>
</html>
