{% args hostname, ap_ssid_prefix, ap_password, station_ssid, station_password, led_count, led_brightness, message %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LED Strip Setup</title>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; display: flex; justify-content: center; padding: 16px; margin: 0; }
    .card { background: #fff; border: 1px solid #d8dee4; border-radius: 12px; padding: 18px; width: 100%; max-width: 520px; }
    h1 { font-size: 1.1rem; margin: 0 0 12px; }
    h2 { font-size: 0.95rem; margin: 16px 0 6px; color: #1f6feb; }
    .row { margin-bottom: 10px; }
    label { display: block; font-size: 0.85rem; color: #6b7785; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; border: 1px solid #d8dee4; border-radius: 8px; box-sizing: border-box; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { width: 100%; padding: 10px; margin-top: 8px; border: none; border-radius: 8px; background: #1f6feb; color: #fff; font-size: 1rem; cursor: pointer; }
    .btn-secondary { background: #e8f0ff; color: #1f6feb; }
    .msg { margin-top: 10px; padding: 8px; border-radius: 8px; background: #e8f0ff; color: #1f2933; font-size: 0.9rem; }
    .links { margin-top: 12px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main class="card">
    <h1>LED Strip Setup</h1>
    <form method="post" action="/">
      <div class="row"><label>Hostname</label>
        <input name="hostname" value="{{ hostname }}"></div>

      <h2>Access Point (fallback)</h2>
      <div class="row"><label>AP SSID prefix</label>
        <input name="ap_ssid_prefix" value="{{ ap_ssid_prefix }}" required></div>
      <div class="row"><label>AP password</label>
        <input name="ap_password" value="{{ ap_password }}" required></div>

      <h2>Wifi station (client)</h2>
      <div class="row"><label>Station SSID</label>
        <input name="station_ssid" value="{{ station_ssid }}" required></div>
      <div class="row"><label>Station password</label>
        <input name="station_password" value="{{ station_password }}" required></div>

      <h2>LED Strip</h2>
      <div class="two-col">
        <div class="row"><label>LED count (0..100)</label>
          <input name="led_count" type="number" min="0" max="100" value="{{ led_count }}" required></div>
        <div class="row"><label>Brightness (0..255)</label>
          <input name="led_brightness" type="number" min="0" max="255" value="{{ led_brightness }}" required></div>
      </div>

      <button type="submit" formaction="/test" formmethod="post" class="btn-secondary">Test LED settings</button>
      <button type="submit">Save and apply</button>
      <div class="msg">{{ message }}</div>
    </form>
    <div class="links"><a href="/status-page">Status page</a> &middot; <a href="/status">Status JSON</a></div>
  </main>
</body>
</html>
